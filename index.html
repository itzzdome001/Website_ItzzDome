<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#9b4de4">
<title>@ItzzDome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #9b4de4;
    --accent-soft: rgba(155, 77, 228, .35);
    --bg: #07050c;
    --card: rgba(18, 12, 30, .55);
    --card-border: rgba(155, 77, 228, .28);
    --text: #f3ecff;
    --muted: #a99bc4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(7,5,12,.3) 25%, rgba(7,5,12,.88) 100%);
  }

  /* ---------- Ladebildschirm ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 10; padding: 0; border: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(30,14,52,.7) 0%, rgba(7,5,12,.94) 75%);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: inherit; font: inherit; cursor: default;
    transition: opacity .8s ease, visibility .8s;
  }
  #splash.ready { cursor: pointer; }
  #splash.hide { opacity: 0; visibility: hidden; }
  #splash:focus-visible { outline: 2px solid var(--accent); outline-offset: -8px; }
  .ld { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .ld-ring { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .ld-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ld-ring circle { fill: none; stroke-width: 3; }
  .ld-ring .track { stroke: rgba(255,255,255,.08); }
  .ld-ring .prog {
    stroke: var(--accent); stroke-linecap: round;
    stroke-dasharray: 339.3; stroke-dashoffset: 339.3;
    filter: drop-shadow(0 0 6px var(--accent));
  }
  .ld-avatar {
    width: 104px; height: 104px; border-radius: 50%; overflow: hidden;
    background: #150d24; display: grid; place-items: center;
    box-shadow: 0 0 0 0 var(--accent-soft);
  }
  .ld-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ld-avatar .initial { font-size: 2.6rem; font-weight: 700; color: var(--accent); }
  #splash.ready .ld-avatar { animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { to { box-shadow: 0 0 0 28px transparent; } }
  .ld-name { font-size: 1.3rem; font-weight: 600; letter-spacing: .02em; text-shadow: 0 0 20px var(--accent-soft); }
  .ld-status { position: relative; display: block; width: 260px; height: 1.5em; text-align: center; }
  .ld-status > span { position: absolute; inset: 0; transition: opacity .5s, transform .5s; }
  #ldPct { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
  #splashText { opacity: 0; transform: translateY(6px); font-weight: 300; letter-spacing: .12em; text-shadow: 0 0 18px var(--accent); }
  #splash.ready #ldPct { opacity: 0; transform: translateY(-6px); }
  #splash.ready #splashText { opacity: 1; transform: none; animation: breathe 2.4s ease-in-out .6s infinite; }
  @keyframes breathe { 50% { opacity: .5; } }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 2; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; perspective: 900px;
  }
  .card {
    width: min(100%, 440px);
    padding: 36px 28px 26px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 0 60px -12px var(--accent-soft), inset 0 0 0 1px rgba(255,255,255,.03);
    text-align: center;
    opacity: 0; transform: translateY(24px) scale(.97);
    transition: opacity .9s ease .25s, transform .9s cubic-bezier(.2,.8,.2,1) .25s;
    will-change: transform;
  }
  body.entered .card { opacity: 1; transform: none; }
  body.entered .card.tilting { transition: transform .08s linear; }

  .avatar {
    width: 112px; height: 112px; margin: 0 auto 16px; border-radius: 50%;
    padding: 3px; background: conic-gradient(from 200deg, var(--accent), #e04dc0, var(--accent));
    box-shadow: 0 0 34px var(--accent-soft);
  }
  .avatar > div {
    width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
    background: #150d24; display: grid; place-items: center;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .initial { font-size: 2.8rem; font-weight: 700; color: var(--accent); }

  h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: .01em; text-shadow: 0 0 22px var(--accent-soft); }
  .uid { margin-top: 4px; font-size: .82rem; color: var(--muted); }
  .bio { margin: 14px auto 0; max-width: 38ch; font-size: 1.02rem; font-weight: 300; line-height: 1.45; }


  .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .links a, .links button {
    width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    color: var(--text); cursor: pointer; text-decoration: none; position: relative;
    transition: background .2s, border-color .2s, transform .2s, box-shadow .2s;
    font: inherit;
  }
  .links a:hover, .links button:hover, .links a:focus-visible, .links button:focus-visible {
    background: var(--accent-soft); border-color: var(--accent); transform: translateY(-3px);
    box-shadow: 0 8px 22px -8px var(--accent); outline: none;
  }
  .links svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .links [data-tip]::after {
    content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%) translateY(4px); white-space: nowrap;
    padding: 4px 9px; border-radius: 7px; font-size: .74rem;
    background: #1d1230; border: 1px solid var(--card-border); opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .15s;
  }
  .links [data-tip]:hover::after, .links [data-tip]:focus-visible::after { opacity: 1; transform: translateX(-50%); }

  .views { margin-top: 22px; display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; color: var(--muted); }
  .views svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #langBtn {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 30;
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(18,12,30,.6); border: 1px solid var(--card-border); color: var(--text);
    cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }
  #langBtn:hover, #langBtn:focus-visible, #langBtn[aria-expanded="true"] {
    background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 22px -6px var(--accent); outline: none;
  }
  #langBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #langMenu {
    position: fixed; top: calc(66px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 30;
    width: 200px; max-height: min(70vh, 460px); overflow-y: auto; padding: 6px;
    border-radius: 14px; background: rgba(18,12,30,.94); border: 1px solid var(--card-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,.7), 0 0 30px -14px var(--accent);
    display: none;
  }
  #langMenu.open { display: block; }
  #langMenu button {
    display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px;
    background: transparent; color: var(--text); font: inherit; font-size: .95rem;
    text-align: start; cursor: pointer;
  }
  #langMenu button:hover, #langMenu button:focus-visible { background: rgba(255,255,255,.07); outline: none; }
  #langMenu button.active { background: var(--accent-soft); font-weight: 600; }

  #bgVideo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: var(--bg); }
  body.hasVideo canvas#bg { opacity: 0; transition: opacity .6s; }
  #muteBtn {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 66px; z-index: 30;
    width: 44px; height: 44px; border-radius: 12px; display: none; place-items: center;
    background: rgba(18,12,30,.6); border: 1px solid var(--card-border); color: var(--text);
    cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .2s, border-color .2s, box-shadow .2s;
  }
  body.entered #muteBtn { display: grid; }
  #muteBtn:hover, #muteBtn:focus-visible { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 22px -6px var(--accent); outline: none; }
  #muteBtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .copyright { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.07); font-size: .74rem; color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    padding: 10px 18px; border-radius: 12px; background: #1d1230; border: 1px solid var(--accent);
    font-size: .9rem; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 640px) { .card { padding: 22px 20px 18px; } .avatar { width: 84px; height: 84px; } }
  @media (prefers-reduced-motion: reduce) {
    .card, #splash { transition: opacity .2s; transform: none !important; }
    #splash.ready .ld-avatar, #splash.ready #splashText { animation: none; }
  }
</style>
</head>
<body>

<video id="bgVideo" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette"></div>

<button id="splash" type="button" aria-label="Seite betreten" disabled>
  <span class="ld">
    <span class="ld-ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="54"/><circle class="prog" id="ldProg" cx="60" cy="60" r="54"/></svg>
      <span class="ld-avatar" id="ldAvatar"></span>
    </span>
    <span class="ld-name" id="ldName"></span>
    <span class="ld-status"><span id="ldPct">0%</span><span id="splashText">klick zum Betreten...</span></span>
  </span>
</button>

<button id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu" aria-label="Sprache">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.8 2.6 4.2 5.6 4.2 9s-1.4 6.4-4.2 9c-2.8-2.6-4.2-5.6-4.2-9S9.2 5.6 12 3z"/></svg>
</button>
<button id="muteBtn" type="button" aria-pressed="false" aria-label="Sound"></button>
<div id="langMenu" role="listbox" aria-label="Sprache"></div>

<main>
  <section class="card" id="card" aria-label="Profil">
    <div class="avatar"><div id="avatarBox"></div></div>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>

    <div class="links" id="links"></div>

    <div class="views">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span><span id="viewCount">0</span> <span id="viewLabel">Profilaufrufe</span></span>
    </div>
    <div class="copyright" id="copyright"></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

let lang = "de";

function applyLang(code, persist) {
  if (!I18N[code]) code = "en";
  lang = code;
  const t = I18N[code];
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir || "ltr";
  $("bio").textContent = t.bio;
  $("splashText").textContent = t.splash;
  $("splash").setAttribute("aria-label", t.enter);
  $("viewLabel").textContent = t.views;
  $("viewCount").textContent = viewsN.toLocaleString(code);
  $("copyright").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name + ". " + t.rights + ".";
  $("langBtn").setAttribute("aria-label", t.lang);
  $("langMenu").setAttribute("aria-label", t.lang);
  const mb = $("muteBtn"); if (mb) mb.setAttribute("aria-label", t.sound);
  document.querySelectorAll("#links > *").forEach(el => {
    const txt = el.dataset.labelKey ? t[el.dataset.labelKey] : el.dataset.baseLabel;
    el.setAttribute("aria-label", txt); el.dataset.tip = txt;
  });
  document.querySelectorAll("#langMenu button").forEach(b => {
    const on = b.dataset.code === code;
    b.classList.toggle("active", on); b.setAttribute("aria-selected", String(on));
  });
  if (persist) { try { localStorage.setItem("lang", code); } catch (e) {} }
}

async function copyText(text) {

}

function updateMuteIcon() {
  const on = !vid.muted;
  muteBtn.innerHTML = on ? SPEAKER_ON : SPEAKER_OFF;
  muteBtn.setAttribute("aria-pressed", String(on));
}
function failVideo() { document.body.classList.remove("hasVideo"); vid.remove(); muteBtn.remove(); }
const videoSources = [CONFIG.videoUrl, CONFIG.videoFallback].filter(Boolean);
if (videoSources.length) {
  videoSources.forEach((u, i) => {
    const so = document.createElement("source");
    so.src = u; so.type = "video/mp4";
    if (i === videoSources.length - 1) so.addEventListener("error", failVideo);
    vid.appendChild(so);
  });
  vid.addEventListener("playing", () => document.body.classList.add("hasVideo"));
  vid.load();
  vid.play().catch(() => {});
  updateMuteIcon();
} else { vid.remove(); muteBtn.remove(); }
function startSound() {
  if (!vid.isConnected) return;
  vid.muted = false; vid.volume = .6;
  vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); updateMuteIcon(); });
  updateMuteIcon();
}
if (muteBtn.isConnected) muteBtn.addEventListener("click", () => {

});

const CIRC = 2 * Math.PI * 54;

const T0 = performance.now(), MIN_MS = 2200, MAX_MS = 7000;
let shown = 0, splashReady = false;
function vidProgress() {
  if (!vid.isConnected) return 1;
  return [0.1, 0.4, 0.7, 1][Math.min(vid.readyState, 3)];
}
function tick(now) {
  const el = now - T0;
  let target = Math.min(Math.min(1, el / MIN_MS), vidProgress());
  if (el > MAX_MS) target = 1;
  shown += (target - shown) * (reduce ? 1 : .1);
  if (target === 1 && shown > .995) shown = 1;
  ldProg.style.strokeDashoffset = CIRC * (1 - shown);
  ldPct.textContent = Math.round(shown * 100) + "%";
  if (shown >= 1) {
    splashReady = true; splash.disabled = false; splash.classList.add("ready"); splash.removeAttribute("aria-busy");
    return;
  }
  requestAnimationFrame(tick);
}
splash.setAttribute("aria-busy", "true");
requestAnimationFrame(tick);

function enter() {
  if (!splashReady) return;
  startSound();
  document.body.classList.add("entered");
  $("splash").classList.add("hide");
  $("splash").setAttribute("tabindex", "-1");
}
$("splash").addEventListener("click", enter);
document.addEventListener("keydown", e => { if (!document.body.classList.contains("entered") && (e.key === "Enter" || e.key === " ") && !e.target.closest("#langBtn, #langMenu, #muteBtn")) enter(); });

/* ---------- 3D-Tilt ---------- */
const card = $("card");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) {
  document.addEventListener("mousemove", e => {
    if (!document.body.classList.contains("entered")) return;
    const x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
    card.classList.add("tilting");
    card.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
  });
  document.addEventListener("mouseleave", () => { card.style.transform = ""; });
}

/* ---------- Eigener Cursor (Bild) ---------- */
function applyCursor(url) {
  const st = document.createElement("style");
  const img = `url("${url}") 0 0`;
  st.textContent =
    `html, body, body * { cursor: ${img}, auto !important; }` +
    `a, a *, button, button *, [role=option] { cursor: ${img}, pointer !important; }`;
  document.head.appendChild(st);
}
function tryCursor(list, i) {
  if (i >= list.length) return;
  const src = list[i], MAX = 48;
  const im = new Image();
  im.crossOrigin = "anonymous";
  im.onload = () => {
    let url = src;
    try {                                   // Bild bei Bedarf auf max. 48px verkleinern
      const sc = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * sc));
      c.height = Math.max(1, Math.round(im.naturalHeight * sc));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      url = c.toDataURL("image/png");
    } catch (e) {}
    applyCursor(url);
  };
  im.onerror = () => {                      // ohne CORS erneut versuchen, dann nächste Quelle
    const im2 = new Image();
    im2.onload = () => applyCursor(src);
    im2.onerror = () => tryCursor(list, i + 1);
    im2.src = src;
  };
  im.src = src;
}
if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
  tryCursor([CONFIG.cursorUrl, CONFIG.cursorFallback].filter(Boolean), 0);
}

/* ---------- Hintergrund: langsam aufsteigende Partikel ---------- */
(function () {
  const c = $("bg"), ctx = c.getContext("2d");
  let w, h, dots = [];
  const dpr = Math.min(devicePixelRatio || 1, 2);
  function resize() {
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    dots = Array.from({ length: Math.round(innerWidth / 14) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.6 + .4) * dpr, v: (Math.random() * .25 + .08) * dpr,
      a: Math.random() * .6 + .2
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w / 2, h * .9, 0, w / 2, h * .9, h);
    g.addColorStop(0, "rgba(155,77,228,.22)"); g.addColorStop(1, "rgba(7,5,12,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#c9a2ff";
    for (const d of dots) {
      ctx.globalAlpha = d.a; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill();
      if (!reduce) { d.y -= d.v; if (d.y < -5) { d.y = h + 5; d.x = Math.random() * w; } }
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { resize(); if (reduce) draw(); });
  resize(); draw();
})();

langBtn.addEventListener("click", e => { e.stopPropagation(); menu.classList.contains("open") ? closeMenu() : openMenu(); });
document.addEventListener("click", e => { if (!e.target.closest("#langMenu")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

/* Startsprache: gespeichert > Browsersprache > Englisch */
(function () {
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  const browser = (navigator.languages && navigator.languages[0] || navigator.language || "en").slice(0, 2).toLowerCase();
  applyLang(saved && I18N[saved] ? saved : (I18N[browser] ? browser : "en"), false);
})();
</script>
</body>
</html>
